# Reverse proxy for a VPS deployment (the alternative to a Cloudflare Tunnel).
#
# Use this when your domain's A record points at a server you control — e.g.
# a GoDaddy-registered domain pointed at a VPS. Get the certificate with:
#   certbot --nginx -d docs.example.com

upstream jjrag {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Rate limiting at the edge, in front of the app's own limiter.
limit_req_zone $binary_remote_addr zone=jjrag_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=jjrag_upload:10m rate=12r/m;

server {
    listen 80;
    server_name docs.example.com;
    # Everything except the ACME challenge goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name docs.example.com;

    ssl_certificate     /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 100M;   # keep in step with ingest.max_file_bytes

    location / {
        limit_req zone=jjrag_api burst=20 nodelay;
        proxy_pass http://jjrag;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;    # local generation can be slow on CPU
    }

    location /api/documents {
        limit_req zone=jjrag_upload burst=5 nodelay;
        proxy_pass http://jjrag;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;    # stream large uploads straight through
        client_max_body_size 100M;
    }

    location /api/query/stream {
        proxy_pass http://jjrag;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;            # required for server-sent events
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
