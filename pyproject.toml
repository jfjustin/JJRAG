[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jjrag"
version = "1.0.0"
description = "Local-only document Q&A pipeline: extract, transform, validate, load, retrieve and answer — entirely on hardware you control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "local-llm", "etl", "privacy", "compliance", "ollama"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime. Deliberately small: every dependency is something a security
# review has to clear. No hosted-model SDKs appear here, or anywhere.
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "PyYAML>=6.0",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
]

[project.optional-dependencies]
# The default embedding backend. Omit it and run with backend="ollama" or
# "hashing" if you cannot ship model weights.
embeddings = ["sentence-transformers>=2.6", "torch>=2.0"]
# Approximate nearest neighbours for corpora past ~100k chunks.
faiss = ["faiss-cpu>=1.8"]
# OCR for scanned PDFs (also needs the tesseract binary on the host).
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
jjrag = "jjrag.cli:main"

[project.urls]
Homepage = "https://github.com/jfjustin/JJRAG"
Documentation = "https://github.com/jfjustin/JJRAG#readme"

[tool.setuptools.packages.find]
include = ["jjrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# N818: exception names read better here without a forced "Error" suffix
# (EgressBlocked, GateFailure, ModelNotInstalled).
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
# B008: FastAPI's Depends()/File() in argument defaults is the framework idiom.
"jjrag/api/*" = ["B008"]
